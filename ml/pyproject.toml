[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitesuri-ml"
version = "0.1.0"
description = "SiteSuri MSME location opportunity score (architecture revision 2)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "xgboost>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.setuptools]
packages = ["sitesuri_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
